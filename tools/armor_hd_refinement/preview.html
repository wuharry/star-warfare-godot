<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裝甲高清細修比較</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;background:#101820;color:#e5edf5}*{box-sizing:border-box}body{margin:0}main{max-width:1500px;margin:auto;padding:28px}h1{font-size:clamp(25px,3vw,38px);margin:0 0 8px}h2{font-size:21px}p{color:#b8c9d6;margin:8px 0 20px}a{color:#94d7ff}label{display:grid;gap:5px;font-size:14px}select,input,button{font:inherit;color:inherit;background:#22323f;border:1px solid #4a6576;border-radius:7px;padding:8px 12px;max-width:100%}button{cursor:pointer}button:hover{background:#314858}.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin:20px 0}.controls label:first-child{flex:1;min-width:200px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0;background:#1a2732;border:1px solid #3e5362;border-radius:10px;overflow:hidden}figcaption{padding:12px 16px;display:flex;justify-content:space-between;gap:12px}figure img{display:block;width:100%;height:auto;cursor:zoom-in}small{color:#a8bac7}.reference{margin:22px 0;border:1px solid #415967;border-radius:10px;padding:16px}.reference .references{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.reference img{max-height:600px;object-fit:contain;background:#1a2732}table{border-collapse:collapse;width:100%;margin:18px 0}th,td{text-align:left;padding:10px;border-bottom:1px solid #354a58}th{color:#acbdcb}td button{padding:4px 10px}#set-note{min-height:26px}dialog{border:1px solid #67889b;background:#14212b;color:inherit;max-width:96vw;max-height:96vh;padding:12px}dialog::backdrop{background:#000c}dialog img{display:block;max-width:89vw;max-height:82vh;object-fit:contain}dialog button{float:right;margin-bottom:8px}.links{display:flex;gap:20px;flex-wrap:wrap}#reference-images[hidden],figure[hidden]{display:none}@media(max-width:650px){main{padding:16px}.comparison,.reference .references{grid-template-columns:1fr}.controls{gap:10px}figcaption{font-size:14px}th,td{padding:8px 4px;font-size:13px}.controls label{flex:1}table{table-layout:fixed}td{overflow-wrap:anywhere}}
</style></head><body><main>
<h1>裝甲高清細節比較</h1>
<p>沿用每套原本的輪廓、配色與 UV 配置，對照 Viper／Fortune 的貼圖清晰度。Thunder 維持原樣。左圖是本次修改前的貼圖，右圖是遊戲目前實際載入的版本；兩側使用相同模型、姿勢、光線與鏡位。</p>
<div class="controls"><label>裝甲<select id="armor"></select></label><label>範圍<select id="framing"><option value="close">頭盔與上半身</option><option value="full">全身</option></select></label><label>角度<select id="view"><option value="front">正面</option><option value="side">側面</option><option value="rear">背面</option></select></label><button id="reset">重設視角</button></div>
<p id="set-note"></p><div class="comparison"><figure id="before-figure"><figcaption><strong>修改前</strong><small>本次開始時的遊戲貼圖</small></figcaption><img id="before" alt="修改前裝甲"></figure><figure><figcaption><strong id="after-label">本次高清細修</strong><small>點圖放大</small></figcaption><img id="after" alt="本次裝甲"></figure></div>
<details class="reference" id="references"><summary>查看 Viper / Fortune 品質基準</summary><p>兩套已完成版本保留原樣，提供相同範圍與角度的畫面比較。</p><div class="references" id="reference-images"></div></details>
<h2>裝甲對應表</h2><p id="scope"></p><table><thead><tr><th>裝甲</th><th>遊戲顯示貼圖數</th><th>本輪處理</th><th>比較</th></tr></thead><tbody id="mapping"></tbody></table>
<p>畫面由實際玩家換裝流程擷取；武器與背包隱藏，使用既有步槍待機姿勢。截圖與遊戲資源雜湊已核對，圖片未經後製；美術喜好仍以逐套畫面驗收為準。</p><div class="links"><a href="verification.json">擷取與資源核對紀錄</a><a id="capture-manifest" href="#">目前裝甲的材質對應</a></div>
</main><dialog id="zoom"><button id="close">關閉</button><img id="zoom-image" alt="裝甲放大圖"></dialog>
<script>
const captures=__CAPTURES__;
const $=id=>document.getElementById(id);
const affected=captures.filter(item=>!item.reference),references=captures.filter(item=>item.reference);
const path=(item,version)=>`sets/${item.key}/${version}_${$('framing').value}_${$('view').value}.png`;
const names={front:'正面',side:'側面',rear:'背面'};
for(const item of captures){const option=document.createElement('option');option.value=item.key;option.textContent=`${item.name}${item.reference?'（基準）':''}`;$('armor').append(option)}
for(const item of captures){const row=document.createElement('tr');const count=new Set(item.parts.flatMap(part=>part.surfaces.map(surface=>surface.texture))).size;for(const text of [item.name,String(count),item.reference?'保留已完成版本':'逐套細節化']){const cell=document.createElement('td');cell.textContent=text;row.append(cell)}const cell=document.createElement('td'),button=document.createElement('button');button.textContent='查看';button.dataset.armor=item.key;button.onclick=()=>{$('armor').value=item.key;refresh();window.scrollTo({top:0,behavior:'smooth'})};cell.append(button);row.append(cell);$('mapping').append(row)}
$('scope').textContent=`${affected.length} 套本次細修，${references.length} 套品質基準。Thunder 未納入修改。`;
for(const item of references){const figure=document.createElement('figure'),caption=document.createElement('figcaption'),image=document.createElement('img');caption.textContent=item.name;image.id=`reference-${item.key}`;image.alt=item.name+' 品質基準';figure.append(caption,image);$('reference-images').append(figure)}
function refresh(){const item=captures.find(entry=>entry.key===$('armor').value)||captures[0];$('before-figure').hidden=item.reference;$('after-label').textContent=item.reference?'保留的品質基準':'本次高清細修';$('before').src=path(item,item.reference?'current':'baseline');$('after').src=path(item,'current');$('before').alt=item.name+' 修改前 '+names[$('view').value];$('after').alt=item.name+' 目前版本 '+names[$('view').value];$('capture-manifest').href=`sets/${item.key}/manifest.json`;$('set-note').textContent=`${item.name} · ${names[$('view').value]} · ${$('framing').value==='full'?'全身':'頭盔與上半身'}`;for(const reference of references)$(`reference-${reference.key}`).src=path(reference,'current');history.replaceState(null,'','#'+item.key)}
for(const id of ['armor','framing','view'])$(id).addEventListener('change',refresh);
$('reset').onclick=()=>{$('framing').value='close';$('view').value='front';refresh()};
document.addEventListener('click',event=>{if(event.target instanceof HTMLImageElement&&event.target.id!=='zoom-image'){$('zoom-image').src=event.target.src;$('zoom-image').alt=event.target.alt;$('zoom').showModal()}});
$('close').onclick=()=>$('zoom').close();
$('zoom').addEventListener('click',event=>{if(event.target===$('zoom'))$('zoom').close()});
$('armor').value=captures.some(item=>item.key===location.hash.slice(1))?location.hash.slice(1):(affected[0]||captures[0]).key;
refresh();
</script></body></html>
