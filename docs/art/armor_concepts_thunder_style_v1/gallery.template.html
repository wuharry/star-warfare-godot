<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thunder 風格 · 全裝甲新草稿</title>
<style>
:root{color-scheme:dark;font:16px/1.65 system-ui,-apple-system,"Microsoft JhengHei",sans-serif;background:#141a20;color:#edf0f2;--line:#35424d;--muted:#b0bdc8;--accent:#add5ec}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,select,input{outline-offset:5px}a{color:var(--accent)}button{cursor:pointer;color:inherit}button:disabled{cursor:default;opacity:.5}.wrap{max-width:1480px;margin:auto;padding:40px 32px}.intro{display:grid;grid-template-columns:1fr 195px;gap:36px;align-items:center;padding-bottom:32px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--accent);margin:0 0 12px}h1{font-size:clamp(27px,3.6vw,46px);line-height:1.25;margin:0 0 20px;font-weight:700}h2{margin:0;font-size:21px}.intro p{max-width:800px;color:var(--muted)}.scope{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.scope span{border:1px solid #42515d;border-radius:30px;padding:3px 12px}.style{border:0;padding:0;background:#28313a;text-align:left;border-radius:8px;overflow:hidden}.style img{display:block;width:100%;height:200px;object-fit:contain;background:#979797}.style span{display:block;padding:8px 12px;font-size:13px}.toolbar{display:flex;gap:16px;align-items:end;flex-wrap:wrap;padding:26px 0}.toolbar label{display:grid;gap:5px;font-size:13px;color:var(--muted)}.toolbar label:first-child{flex:1;min-width:200px}.toolbar input,.toolbar select{color:inherit;background:#202a33;border:1px solid #4c5b67;padding:10px 12px;border-radius:6px;min-height:46px;max-width:100%}#count{color:var(--muted);font-size:14px;align-self:center;white-space:nowrap}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.card{background:#202a33;border:1px solid var(--line);border-radius:9px;overflow:hidden;min-width:0}.card[hidden]{display:none}.art-button{display:block;border:0;padding:0;width:100%;background:#969696;position:relative}.art-button img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:contain;transition:filter .2s}.art-button:hover img{filter:brightness(1.07)}.art-button::after{content:'查看對照 ↗';position:absolute;bottom:10px;right:10px;background:#14202ddd;padding:3px 9px;border-radius:4px;font-size:12px}.card-copy{padding:16px}.card-title{display:flex;align-items:baseline;gap:8px}.number{color:#8d9ba5;font-size:12px;font-variant-numeric:tabular-nums}.card h2{font-size:19px}.palette{color:#c4cfd7;font-size:13px;margin:10px 0 0;line-height:1.7}.feature{font-size:12px;color:#96aab8;margin:7px 0 0}#empty{padding:60px 0;color:var(--muted)}footer{margin-top:32px;border-top:1px solid var(--line);padding:22px 0 0;color:var(--muted);font-size:13px;display:flex;gap:14px 28px;flex-wrap:wrap}footer p{margin:0;flex:1;min-width:220px}dialog{padding:0;background:#17212a;color:inherit;border:1px solid #62717c;border-radius:10px;width:min(1250px,96vw);max-height:94vh;overflow:auto}dialog::backdrop{background:#02080dd9;backdrop-filter:blur(5px)}.viewer-top{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#17212af5;z-index:1}.viewer-actions{display:flex;gap:8px}.small-button{border:1px solid #4c6070;background:#283746;padding:6px 12px;border-radius:5px;white-space:nowrap}.small-button:hover{background:#3d5264}.viewer-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px 22px}.viewer-grid figure{margin:0;min-width:0}.viewer-grid figcaption{font-size:14px;display:flex;align-items:center;justify-content:space-between;min-height:40px;gap:10px;margin-bottom:8px}.viewer-grid select{max-width:190px;background:#273643;color:inherit;border:1px solid #536773;padding:5px}.viewer-grid img{display:block;width:100%;height:60vh;min-height:300px;object-fit:contain;background:#313a43;border-radius:5px}.viewer-note{padding:0 22px 22px;color:var(--muted);font-size:14px}.viewer-note p{margin:5px 0}.viewer-links{display:flex;flex-wrap:wrap;gap:20px;margin-top:14px}.keytip{font-size:12px;color:#8ea2b1}body:has(dialog[open]){overflow:hidden}@media(min-width:1550px){.gallery{gap:26px}}@media(max-width:1100px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:800px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:25px 20px}.intro{grid-template-columns:1fr 135px;gap:20px}.style img{height:160px}}@media(max-width:520px){.wrap{padding:24px 14px}.intro{grid-template-columns:1fr}.style{display:flex;align-items:center;width:100%}.style img{height:100px;width:95px}.style span{padding:14px}.gallery{grid-template-columns:1fr;gap:20px}.card-copy{padding:16px 18px}.toolbar label{flex:1}.toolbar{gap:12px}.viewer-top{padding:12px;align-items:flex-start}.viewer-top h2{font-size:17px}.viewer-actions{gap:5px}.small-button{font-size:13px;padding:5px 8px}.viewer-grid{grid-template-columns:1fr;padding:12px;gap:20px}.viewer-grid img{height:auto;max-height:68vh;min-height:0}.viewer-note{padding:0 12px 18px}.keytip{display:none}}
</style></head>
<body><main class="wrap">
<header class="intro"><div><p class="eyebrow">STAR WARFARE / ARMOR CONCEPTS</p><h1>28 套裝甲，<br>Thunder 草稿風格。</h1><p>沿用各套裝甲的原配色與辨識特徵，重新刻畫厚實板甲、俐落稜角與細緻手繪表面。點選裝甲，就能與原版全身、頭盔近景或 Thunder 參考圖並排查看。</p><div class="scope"><span>28 套新草稿</span><span>保留原配色</span><span>待選定的概念圖</span></div></div><button class="style" id="style-open" aria-label="開啟 Thunder 風格參考對照"><img src="references/thunder_style.png" alt="本輪採用的 Thunder 全身風格參考"><span>Thunder 風格基準 ↗</span></button></header>
<div class="toolbar"><label>搜尋裝甲<input id="search" type="search" placeholder="名稱、配色或造型特徵" autocomplete="off"></label><label>系列<select id="group"><option value="all">全部裝甲</option><option value="sw">Star Warfare</option><option value="com">追加裝甲</option></select></label><span id="count" aria-live="polite"></span></div>
<section id="gallery" class="gallery" aria-label="裝甲草稿圖集"></section><p id="empty" hidden>沒有符合條件的裝甲，請換個名稱或配色搜尋。</p>
<footer><p>本輪交付概念圖；遊戲模型與貼圖保持原版本。背面設計及實裝細節於選定草稿後另行製作。</p><a href="manifest.json">各套來源與檢視紀錄</a><a href="README.md">製作說明</a></footer>
</main>
<dialog id="viewer" aria-labelledby="viewer-name"><div class="viewer-top"><div><h2 id="viewer-name"></h2><span class="keytip">← → 切換裝甲 · Esc 關閉</span></div><div class="viewer-actions"><button id="prev" class="small-button" aria-label="上一套裝甲">←</button><button id="next" class="small-button" aria-label="下一套裝甲">→</button><button id="close" class="small-button">關閉</button></div></div>
<div class="viewer-grid"><figure><figcaption><span id="reference-label">原裝甲參考</span><select id="reference-view" aria-label="參考圖片角度"><option value="original">原裝甲全身</option><option value="helmet">原頭盔近景</option><option value="rear">原裝甲背面</option><option value="style">Thunder 風格</option></select></figcaption><a id="reference-file" target="_blank" rel="noopener"><img id="reference-image" alt="原裝甲參考"></a></figure><figure><figcaption><strong>本輪新草稿</strong><span>點圖看原尺寸</span></figcaption><a id="concept-file" target="_blank" rel="noopener"><img id="concept-image" alt="新裝甲概念草稿"></a></figure></div>
<div class="viewer-note"><p id="viewer-palette"></p><p id="viewer-features"></p><p id="viewer-review"></p><div class="viewer-links"><a id="download" download>下載草稿 PNG</a><a id="prompt" target="_blank" rel="noopener">完整生成提示詞</a></div></div></dialog>
<script>
window.concepts=__CONCEPTS__;
const $=id=>document.getElementById(id);let selected=concepts[0],lastFocus=null;
for(const item of concepts){const card=document.createElement('article');card.className='card';card.dataset.id=item.id;card.dataset.search=[item.id,item.name,item.palette,item.features].join(' ').toLocaleLowerCase();card.dataset.group=item.group;const button=document.createElement('button');button.className='art-button';button.dataset.open=item.id;button.setAttribute('aria-label','查看 '+item.name+' 新草稿與原版對照');const image=document.createElement('img');image.src=item.image;image.alt=item.name+'：'+item.palette;image.loading='lazy';image.width=item.dimensions[0];image.height=item.dimensions[1];button.append(image);button.onclick=()=>openViewer(item.id);const copy=document.createElement('div');copy.className='card-copy';const title=document.createElement('div');title.className='card-title';const number=document.createElement('span');number.className='number';number.textContent=String(item.id).padStart(2,'0');const name=document.createElement('h2');name.textContent=item.name;title.append(number,name);const palette=document.createElement('p');palette.className='palette';palette.textContent=item.palette;const features=document.createElement('p');features.className='feature';features.textContent=item.features;copy.append(title,palette,features);card.append(button,copy);$('gallery').append(card)}
function filter(){const query=$('search').value.trim().toLocaleLowerCase(),group=$('group').value;let count=0;for(const card of document.querySelectorAll('.card')){card.hidden=!(card.dataset.search.includes(query)&&(group==='all'||card.dataset.group===group));if(!card.hidden)count++}$('count').textContent=`${count} / ${concepts.length} 套`;$('empty').hidden=count!==0}
function visibleIds(){return [...document.querySelectorAll('.card:not([hidden])')].map(card=>Number(card.dataset.id))}
function refreshViewer(){const reference=$('reference-view').value,source=selected.references[reference];$('viewer-name').textContent=String(selected.id).padStart(2,'0')+' · '+selected.name;$('reference-image').src=source;$('reference-image').alt=reference==='style'?'Thunder 風格參考':selected.name+' 原裝甲 '+reference;$('reference-label').textContent=reference==='style'?'Thunder 風格參考':'原裝甲參考';$('reference-file').href=source;$('concept-image').src=selected.image;$('concept-image').alt=selected.name+' 本輪新草稿';$('concept-file').href=selected.image;$('download').href=selected.image;$('download').download=selected.name.replaceAll(' ','_')+'_concept.png';$('prompt').href=selected.prompt;$('viewer-palette').textContent='配色｜'+selected.palette;$('viewer-features').textContent='保留特色｜'+selected.features;$('viewer-review').textContent=selected.review;$('prev').disabled=$('next').disabled=visibleIds().length<2;history.replaceState(null,'','#armor_'+String(selected.id).padStart(2,'0'))}
function openViewer(id){selected=concepts.find(item=>item.id===Number(id))||concepts[0];lastFocus=document.activeElement;refreshViewer();if(!$('viewer').open)$('viewer').showModal()}
function step(direction){const ids=visibleIds();if(!ids.length)return;let index=ids.indexOf(selected.id);selected=concepts.find(item=>item.id===ids[(index+direction+ids.length)%ids.length]);refreshViewer()}
$('search').oninput=filter;$('group').onchange=filter;$('reference-view').onchange=refreshViewer;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('close').onclick=()=>$('viewer').close();$('style-open').onclick=()=>{$('reference-view').value='style';openViewer(selected.id)};
$('viewer').addEventListener('click',event=>{if(event.target===$('viewer')){const r=$('viewer').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)$('viewer').close()}});
$('viewer').addEventListener('close',()=>{history.replaceState(null,'',location.pathname+location.search);lastFocus?.focus()});document.addEventListener('keydown',event=>{if(!$('viewer').open||event.target instanceof HTMLSelectElement)return;if(event.key==='ArrowLeft'){event.preventDefault();step(-1)}if(event.key==='ArrowRight'){event.preventDefault();step(1)}});
filter();const linked=location.hash.match(/^#armor_(\d+)$/);if(linked&&concepts.some(item=>item.id===Number(linked[1])))openViewer(Number(linked[1]));
</script></body></html>
